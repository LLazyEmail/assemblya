name: Test deployment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-deploy:
    name: Test build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docusaurus
        uses: LLazyEmail/documentation-actions/actions/docusaurus-build@v1
        with:
          working-directory: .
          cache-dependency-path: package-lock.json
          node-version: '24'
