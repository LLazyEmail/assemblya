name: Test deployment

# Thin caller for documentation-actions reusable-docs-ci (build only).
# Prefer docs-ci over the legacy reusable-docusaurus-test-deploy path.
# Do NOT enable lfs: true — LFS objects 404 on this fork.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test-deploy:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-docs-ci.yml@v1
    with:
      working-directory: .
      cache-dependency-path: package-lock.json
      node-version: '24'
      run-build: true
      lfs: false
      annotate-log: true
    secrets: inherit
