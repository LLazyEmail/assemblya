name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# contents: write required on the caller until documentation-actions#33
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-docusaurus-pages-deploy.yml@v1
    with:
      working-directory: .
      cache-dependency-path: package-lock.json
      artifact-path: build
      node-version: '24'
    secrets: inherit
